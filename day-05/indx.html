<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job application</title>
</head>
<body>
    <h1>job application form </h1>
    <div>
    <label for="full">full name :</label>
    <input type="text" placeholder="full name ">
</div>

<div>
    <label for="email">email address :</label>
    <input type="text" placeholder="email address">
</div>

<div>
    <label for="phone number">phone number :</label>
    <input type="tel" placeholder="phone number">
</div>

<div>
<label for="resume">resume file upload</label>
<input type="file" placeholder="resume file upload">    
</div>

<h2>experience-</h2>
<div>
<input type="radio" name="experience" value="fresher" required>
<label for="fresher">fresher</label>
<br>
<input type="radio" name="experience" value="1-2 years" required>
<label for="1-2 years">1-2 years</label>
<br>
<input type="radio" name="experience" value="3+ years" required>
<label for="3+ years"> 3+ years</label>
</div>
<br>

<h2>known tecnologies</h2>
<input type="checkbox" name="html" value="html">
<label for="html">html</label>
<br>
<input type="checkbox" name="css" value="css">
<label for="css">css</label>
<br>
<input type="checkbox"name="javascript" value="javascript">
<label for="javascript">javascript</label>
<br>
<input type="checkbox"name="c" value="c">
<label for="c">c</label>
<br>
<input type="checkbox"  name="SQL" value="SQL"> 
<label for="SQL">SQL</label>
<br>
</body>
</html>
